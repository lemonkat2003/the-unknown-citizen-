/* v5 — focus-first layout */
:root{--bg:#0d1218;--paper:#142029;--edge:#34434b;--gold:#e4c48b}
.layout{grid-template-columns:184px minmax(0,1fr);max-width:1490px;margin:0 auto}
.activity{display:none}
.app{max-width:1120px;width:100%;margin:auto;padding:34px clamp(18px,3.6vw,55px) 65px}
.rail{padding:23px 12px;background:#111b23}
.railHead{margin:17px 11px 11px}
.navitem{padding:13px 11px;margin-bottom:7px;font-size:12px;border-radius:6px}
.railCase{margin:0 9px;background:#1a2a33;border:1px solid #314550;border-radius:7px;padding:13px;font-size:12px;display:grid;gap:3px}
.railCase span,.railCase small{font-size:11px;color:var(--soft)}
.miniCount{font-size:10px;color:var(--gold)}
.casebrief,.storycard,.dialogue,.paper,.deduction{box-shadow:none}
.storycard{background:#111c24;border-color:#293c47}
.citylist{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mapmini{min-height:76px;padding:15px}
.mapmini small{display:block;margin-top:4px}
.scene{max-width:1030px;margin:auto;aspect-ratio:16/8.3}
.hotspot{max-width:125px}
.topicList{overflow:auto;max-height:310px}
.topic{display:flex;justify-content:space-between;gap:12px;align-items:center}
.topic small{font:10px 'IBM Plex Mono',monospace;color:#e0c58c;text-align:right;flex:none}
.topic:disabled{opacity:.4}
.diceResult{display:flex;gap:16px;align-items:center;border:1px solid #735e3f;background:#1d2d35;border-radius:7px;padding:12px}
.dieFace{width:66px;height:66px;flex:none;border:2px solid #d5b87c;display:grid;place-items:center;background:#e9ddc3;color:#222c35;border-radius:10px;font:700 42px Georgia,serif;box-shadow:inset 0 0 0 4px #d0be9c}
.diceResult p{font-size:12px;margin-top:3px}
.evidenceOverlay{position:fixed;inset:0;z-index:30;background:#05090ddc;backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px}
.evidenceModal{width:min(100%,570px);max-height:90vh;overflow:auto;background:#17242d;border:1px solid #b19465;box-shadow:0 24px 85px #000b;padding:26px 30px;border-radius:10px;animation:fadein .23s ease}
.evidenceModal h2{font-size:clamp(26px,3.4vw,38px);margin:9px 0 15px;color:#f1e4d0}
.evidenceDescription{font:17px/1.8 Georgia,serif;color:#dfe2db;white-space:pre-wrap}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:9px;border-bottom:1px solid #384752;padding-bottom:12px}
.evidenceEmblem{font:62px Georgia,serif;color:#d7bd8e;text-align:center;padding:23px 0 9px}
.modalFoot{display:flex;gap:9px;align-items:center;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #384752;margin-top:23px;padding-top:17px}
.modalFoot p{flex:1}
#notes{min-height:230px;line-height:1.65;font-size:14px}
.paper{background:#e8dfcb}
.journalGrid{grid-template-columns:minmax(0,1.05fr) minmax(250px,.95fr)}
@media(max-width:950px){.layout{grid-template-columns:150px minmax(0,1fr)}.app{padding:25px 21px 45px}.rail{padding:13px 7px}.journalGrid{grid-template-columns:1fr}}
@media(max-width:690px){.layout{display:block}.rail{padding:9px;display:flex;gap:6px;overflow-x:auto}.railCase,.rail .rule{display:none}.app{padding:18px 13px 45px}.citylist{grid-template-columns:1fr}.scene{aspect-ratio:4/3}.evidenceModal{padding:19px}.topic{align-items:flex-start}.topic small{font-size:9px}.speaker{grid-template-columns:1fr}.portrait{max-height:240px}.dialogue{padding:16px}}

.districtGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.districtTile{display:flex;gap:13px;align-items:center;text-align:left;background:#1a2a34;border:1px solid #354a54;border-radius:7px;min-height:88px;padding:15px;transition:border-color .16s,background .16s}
.districtTile:hover{background:#283d49;border-color:var(--gold)}
.districtMark{width:40px;height:40px;display:grid;place-items:center;border:1px solid #896e4e;border-radius:50%;color:var(--gold);font-size:22px;flex:none}
.districtTile b{font:600 15px Georgia,serif;color:#ebdcc3;display:block}
.districtTile small{display:block;font:9px 'IBM Plex Mono',monospace;color:#acb7c0;margin-top:5px}
.districtArrow{margin-left:auto;color:var(--gold);font-size:20px}
@media(max-width:690px){.districtGrid{grid-template-columns:1fr}}

/* V6: evidence artwork, always-available case desk, nonblocking examination */
.caseChoices{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:12px;margin-top:17px}
.caseChoices .tile{min-height:154px}
.caseChoices .tile h3{font-size:19px;line-height:1.24}
.evidenceOverlay{position:fixed;inset:0;z-index:32;display:flex;justify-content:center;align-items:center;padding:32px;background:#070e14b5;backdrop-filter:blur(4px);pointer-events:auto}
.evidenceModal{pointer-events:auto;max-height:min(88vh,760px);width:min(520px,100%);padding:22px 25px;background:#172530;border:1px solid #aa8b5d;box-shadow:0 20px 75px #000d}
.evidencePicture{display:block;width:100%;height:205px;margin:13px 0 15px;border:1px solid #3b525c;border-radius:5px;object-fit:cover}
.evidenceModal h2{font-size:clamp(24px,3vw,31px);margin:6px 0 10px}
.evidenceDescription{font-size:15px;line-height:1.6}
.evidenceModal .modalFoot{margin-top:15px;padding-top:14px}
.evidenceModal .btn{min-height:40px}
@media(max-width:1020px){.caseChoices{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:690px){.caseChoices{grid-template-columns:1fr 1fr!important}.evidenceOverlay{padding:10px;align-items:flex-end;justify-content:center}.evidenceModal{width:100%;max-height:83vh;padding:14px}.evidencePicture{height:150px}.evidenceDescription{font-size:14px}.modalFoot{justify-content:stretch}.modalFoot .btn{flex:1}}

/* Visible, reduced-motion-aware d6 roll before a random settled face. */
.rollingDie{display:inline-grid;place-items:center;min-width:72px;min-height:72px;animation:diceTumble .36s linear infinite;transform-origin:center;box-shadow:0 8px 21px #0005}
.diceRolling{border-color:#dfbc7f!important;background:linear-gradient(110deg,#1d3440,#2d3840)!important}
@keyframes diceTumble{0%{transform:rotate(-13deg) scale(.91)}33%{transform:rotate(24deg) scale(1.12)}66%{transform:rotate(-18deg) scale(.94)}100%{transform:rotate(347deg) scale(1)}}
@media(prefers-reduced-motion:reduce){.rollingDie{animation:none}}

/* V8 — weighty three-dimensional-feeling pip die with a readable resting face */
.die3d{width:78px;height:78px;min-width:78px;flex:none;display:grid;place-items:center;perspective:260px;transform-origin:center;will-change:transform;filter:drop-shadow(0 12px 5px #050a0e8a)}
.dieSurface{width:68px;height:68px;border-radius:12px;border:2px solid #fff7df;background:linear-gradient(145deg,#fff3cf 0%,#e6cca0 68%,#c6a879 100%);box-shadow:inset 3px 3px 5px #ffffff9c,inset -5px -6px 5px #b79a69,5px 7px 0 #876d4c,7px 11px 12px #0005;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:3px;backface-visibility:hidden}
.pip{width:11px;height:11px;border-radius:50%;background:transparent;justify-self:center;align-self:center}
.pip.on{background:#23333b;box-shadow:inset 1px 2px 2px #0d1418,0 1px 1px #fff9e4}
.dieSpinning{animation:dieFlight .72s cubic-bezier(.45,.08,.6,.96) infinite alternate}
.dieSpinning .dieSurface{animation:dieRattle .29s ease-in-out infinite alternate}
.dieSettled{animation:dieLand .45s cubic-bezier(.21,1.75,.35,1) both}
@keyframes dieFlight{0%{transform:translate(-15px,5px) rotate(-35deg) rotateY(-30deg) scale(.8)}30%{transform:translate(6px,-19px) rotate(115deg) rotateX(35deg) scale(1.06)}70%{transform:translate(14px,-10px) rotate(240deg) rotateY(50deg) scale(1.11)}100%{transform:translate(-2px,7px) rotate(395deg) rotateX(-30deg) scale(.94)}}
@keyframes dieRattle{from{transform:rotateX(-24deg) rotateY(24deg)}to{transform:rotateX(28deg) rotateY(-21deg)}}
@keyframes dieLand{0%{transform:translateY(-18px) rotate(-25deg) scale(1.14)}65%{transform:translateY(3px) rotate(8deg) scale(.97)}100%{transform:translateY(0) rotate(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.dieSpinning,.dieSpinning .dieSurface,.dieSettled{animation:none}}

/* V10: physically legible six-faced 3D cube, persistent after landing. */
.diceRollStation{display:grid;grid-template-columns:142px minmax(0,1fr);gap:9px 18px;align-items:center;padding:15px 17px;background:radial-gradient(circle at 80px 90px,#304453,#14222c 78%);border:1px solid #8a714e;border-radius:8px}
.diceRollStation>.eyebrow{grid-column:1/-1}
.diceThrowButton{width:136px;height:140px;display:flex;align-items:center;justify-content:center;border:1px solid #997e52;border-radius:12px;background:linear-gradient(180deg,#344654,#1a2a35);cursor:pointer;overflow:visible;transition:background .2s,box-shadow .2s}
.diceThrowButton:not(:disabled):hover{background:#405968;box-shadow:0 0 0 3px #dfbc7f45}
.diceThrowButton:disabled{cursor:default;opacity:1}
.diceThrowButton.isRolling{border-color:#dfbc7f;box-shadow:0 0 22px #dfbc7f4b}
.diceCallout strong{color:#e7d3ae;letter-spacing:.06em;font:600 12px/1.5 'IBM Plex Mono',monospace}
.diceCallout p{font-size:12px;margin-top:6px}
.diceStage{display:block;width:104px;height:112px;position:relative;perspective:520px;isolation:isolate}
.diceShadow{position:absolute;left:18px;right:18px;bottom:6px;height:13px;border-radius:50%;background:#05090c9e;filter:blur(5px);animation:none}
.dieFlight{display:block;position:absolute;width:68px;height:68px;top:13px;left:18px;transform-style:preserve-3d}
.diceCube{display:block;position:absolute;inset:0;width:68px;height:68px;transform-style:preserve-3d;transform:rotateX(var(--end-x)) rotateY(var(--end-y));will-change:transform}
.cubeFace{display:grid;position:absolute;top:0;left:0;width:68px;height:68px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;padding:9px;border-radius:9px;border:2px solid #faf0d8;background:linear-gradient(138deg,#fff7dc 0%,#e7c891 90%);box-shadow:inset -6px -6px 10px #a2784580,inset 3px 3px 8px #ffffffa8;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:flat}
.cubePip{display:block;width:10px;height:10px;border-radius:50%;align-self:center;justify-self:center}
.cubePip.lit{background:#25313a;box-shadow:inset 1px 2px 2px #050d13,0 1px 1px #fff}
.cube-front{transform:rotateY(0deg) translateZ(34px)}
.cube-back{transform:rotateY(180deg) translateZ(34px)}
.cube-right{transform:rotateY(90deg) translateZ(34px)}
.cube-left{transform:rotateY(-90deg) translateZ(34px)}
.cube-top{transform:rotateX(90deg) translateZ(34px)}
.cube-bottom{transform:rotateX(-90deg) translateZ(34px)}
.dieFlightRolling{animation:uc10-flight 1.7s cubic-bezier(.17,.57,.31,.99) both}

// The 3D object is a real six-faced CSS cube. The selected question does not trigger a roll.
// Faces: front=1, top=2, right=3, left=4, bottom=5, back=6.
function dieMarkup(value=1,phase='idle'){
 // Faces use actual outward-facing cube normals. The final face remains visible after landing.
 const dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
 const faces=[['front',1],['top',2],['right',3],['left',4],['bottom',5],['back',6]];
 const faceHTML=faces.map(([side,num])=>`<div class="cubeFace cube-${side}">${Array.from({length:9},(_,i)=>`<i class="cubePip ${dots[num].includes(i)?'lit':''}"></i>`).join('')}</div>`).join('');
 // Correct landing rotations: front 1; top 2; right 3; left 4; bottom 5; back 6.
 const landing={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]}[value]||[0,0];
 const [rx,ry]=landing;
 return `<div class="diceStage" aria-hidden="true"><div class="diceShadow"></div><div class="dieFlight ${phase==='rolling'?'dieFlightRolling':''}"><div class="diceCube ${phase==='rolling'?'diceCubeRolling':'diceCubeResting'}" style="--end-x:${rx}deg;--end-y:${ry}deg;--start-x:${rx-1260}deg;--start-y:${ry+1440}deg">${faceHTML}</div></div></div>`;
}
function recordTestimony(){
 if(G.screen!=='talk'||G.rolling||!G.dialogueRoll||!G.dialogue||!G.npc)return;

 if(!topic)return;
 if(!Array.isArray(G.testimonies))G.testimonies=[];
 const id=role+':'+roll.topicId;
 const item={id,role,witness:G.case.people[role].name,question:topic.label,text:G.dialogue.text,roll:roll.value,bonus:!!roll.bonus,place:G.case.people[role].place};
 const i=G.testimonies.findIndex(e=>e.id===id);
 // One journal entry per witness/question. If the player files a later, stronger answer, upgrade it.
 if(i>=0){
  const old=G.testimonies[i];
  const oldQuality=(old.roll>=5?2:old.roll>=3?1:0);
  const newQuality=(roll.value>=5?2:roll.value>=3?1:0);
  if(newQuality<oldQuality)return;
  G.testimonies[i]=item;
 }else{G.testimonies.push(item)}
 pushLog('TESTIMONY FILED',item.witness+' — '+item.question);

 if(q.id==='citizen')return /greenhouse|glasshouse/.test(x)&&/demol|destroy|order|cleared|tear down|tore down/.test(x);
 if(q.id==='citizen-evidence-a')return /demol|clear|glasshouse|greenhouse/.test(x)&&/order|signature|signed|document/.test(x);
 if(q.id==='citizen-evidence-b')return /photo|picture|photograph|image/.test(x)&&/greenhouse|glasshouse|childhood|school/.test(x);
 if(q.id==='hobby')return /botanical|drawing|sketch/.test(x);
 if(q.id==='dream'){let y=normalize(q.answer);return x.length>=5&&y.includes(x)}
 if(q.id==='job')return /clerk|municipal/.test(x);
 return false;
}
function reportView(){const questions=questionSet();return `<section class="reportCard reportWide"><div class="eyebrow">FINAL FILE / ${escapeHTML(G.case.id)}</div><h2 style="margin:10px 0">Citizen Report — Martin Vale</h2><p class="muted">Select an answer box on the left, then click matching evidence from the Field Journal on the right. Five of six correct findings are required.</p><div class="options" style="margin-bottom:14px"><button class="btn subtle" data-view="map">← CONTINUE INVESTIGATION</button></div><div class="mobileMatchHint" role="status">${G.activeReportField?`Matching: <strong>${escapeHTML(questions.find(q=>q.id===G.activeReportField)?.label||'Report field')}</strong> <span>— tap a journal fact below.</span>`:'Tap an answer box, then select a fact from the journal below.'}</div><div class="reportSplit"><div class="reportForm"><div class="eyebrow">FORM C/06 · MATCH THE EVIDENCE</div>${questions.map((q,i)=>`<div class="shortQuestion"><span class="questionNum">${String(i+1).padStart(2,'0')}</span><div class="questionContents"><strong>${escapeHTML(q.label)}</strong><button type="button" class="reportSelection reportAnswerBox ${G.answers[q.id]?'filled':''} ${G.activeReportField===q.id?'reportTargetSelected':''}" data-report-slot="${q.id}" aria-pressed="${G.activeReportField===q.id?'true':'false'}">${G.answers[q.id]?escapeHTML(G.answers[q.id]):G.activeReportField===q.id?'Now choose a matching journal fact →':'Click here to select this answer box'}</button>${G.answers[q.id]?`<button type="button" class="clearReportSelection" data-clear-report="${q.id}">Clear selection</button>`:''}</div></div>`).join('')}<button class="btn primary big reportSubmit" data-action="submit">SUBMIT REPORT & RECEIVE SCORE →</button></div><aside class="reportJournal" aria-label="Field journal alongside final report">${journalPanel(true)}</aside></div></section>`}
function resultView(){let qs=questionSet(),score=G.score,passed=score>=5;return `<section class="reportCard"><div class="eyebrow">OFFICIAL GOVERNMENT REVIEW / ${escapeHTML(G.case.id)}</div><h1 style="margin:13px 0">${passed?'FILE ACCEPTED':'FILE INCOMPLETE'}</h1><div class="casebrief"><div class="eyebrow">ACCURACY RATING</div><div class="metric" style="font-size:70px">${score}<span class="muted" style="font-size:26px">/${qs.length}</span></div><div class="progress"><span style="width:${score/qs.length*100}%"></span></div><p style="margin-top:13px">${passed?'The Bureau has accepted the citizen report.':'At least five of six correct answers are required.'}</p></div><h2 style="margin:24px 0 15px">Report review</h2>${qs.map((q,i)=>{let x=G.answers[q.id]||'',ok=answerMatches(q,x);return `<div class="review ${ok?'ok':'no'}"><strong>${ok?'✓':'✕'} ${escapeHTML(q.label)}</strong><p class="muted">Correct: ${escapeHTML(q.answer)}</p><p class="muted">Filed: ${escapeHTML(x||'No answer')}</p></div>`}).join('')}<div class="options"><button class="btn" data-action="show-secrets">DID YOU NOTICE? · OTHER SECRETS</button><button class="btn primary big" data-action="new-dossier">RESTART MARTIN’S CASE ↗</button><button class="btn" data-view="journal">REVIEW FIELD JOURNAL</button></div></section>`}


function afterReportSecrets(){
 const entries=[
  {role:'partner',summary:'Secret violinist in the Red Lantern Quartet',evidence:['Ada’s violin case','Red Lantern Quartet programme']},
  {role:'colleague',summary:'Performed at Regent Theatre as Madame Sable',evidence:['Daniel’s stage dress','Regent Theatre cast and payment ledger']},
  {role:'neighbor',summary:'Secretly admired Rosa Calder',evidence:['Beatrice’s unsent letter','Sketch of Rosa Calder']},
  {role:'friend',summary:'Altered G-41’s review date to protect Martin',evidence:['Amended demolition register G-41','Evelyn’s signed explanation']},
  {role:'clerk',summary:'Secretly kept the closed theatre heated for rehearsals',evidence:['Theatre heating bill','Boiler maintenance log']},
  {role:'owner',summary:'Entered a baking contest as Rose C.',evidence:['Rose C. recipe card','District Bake-Off registration']}
 ];
 return `<div class="secretRevealOverlay" role="presentation"><section class="secretRevealModal" role="dialog" aria-modal="true" aria-labelledby="secretsTitle"><div class="eyebrow">CONFIDENTIAL ADDENDUM / PERSONAL LIVES</div><h2 id="secretsTitle">Did you notice?</h2><p>The official report is about Martin Vale. But every witness had a hidden life the Bureau’s form never asked you to describe.</p><div class="secretRevealRows">${entries.map(e=>`<article class="secretRevealRow"><h3>${escapeHTML(G.case.people[e.role].name)}</h3><strong>${escapeHTML(e.summary)}</strong><p>Clues: ${e.evidence.map(escapeHTML).join(' · ')}</p></article>`).join('')}</div><p class="secretRevealThought">An official file can be complete without ever containing the whole person.</p><div class="options" style="justify-content:flex-end"><button class="btn primary" data-action="dismiss-secrets">RETURN TO REPORT RESULTS →</button></div></section></div>`;
}

function render(){header();$('#rail').innerHTML=rail();$('#activity').innerHTML=activity();if(!G.started){$('#app').innerHTML=dispatch();return}$('#app').innerHTML=G.done?resultView():G.screen==='map'?mapView(G.district||null):G.screen==='room'?roomView():G.screen==='talk'?talkView():G.screen==='journal'?journalView():G.screen==='report'?reportView():mapView();if(G.pending){$('#app').insertAdjacentHTML('beforeend',evidenceModal())}if(G.done&&G.showSecretsReveal){$('#app').insertAdjacentHTML('beforeend',afterReportSecrets())}if(G.confirmReset){$('#app').insertAdjacentHTML('afterbegin',`<div class="finding negative" style="margin-bottom:17px"><div class="eyebrow">CONFIRM NEW ASSIGNMENT</div><h3 style="margin:7px 0">Restart the Martin Vale investigation?</h3><p>Current unsaved progress will be cleared. Your current case file will remain as a historical identifier only.</p><div class="options"><button class="btn" data-action="cancel-reset">KEEP PLAYING</button><button class="btn primary" data-action="confirm-reset">RESTART CASE</button></div></div>`)}}
function startCase(i){G=newState(choices[i]);G.started=true;choices=[];G.finding={kind:'observation',title:'Case assigned',body:`Assigned to review ${G.case.citizen}, ${G.case.job}. West Ward and Civic Center are open; other sites will unlock only when witnesses mention them.`};pushLog('NEW ASSIGNMENT',G.case.citizen);save();render()}
function tick(){if(!G||!G.started||G.done||G.rolling||!!G.pending||!G.timing||G.paused||G.screen==='report'||G.screen==='journal')return;G.seconds=Math.max(0,G.seconds-1);const display=$('#timeText');if(display)display.textContent=formatTime(G.seconds);if(G.seconds===0){G.timing=false;G.finding={kind:'observation',title:'Shift elapsed',body:'Your fifteen-minute shift is over. You may continue investigating without a deadline, or file the report now.'};pushLog('SHIFT ELAPSED','Investigation may continue in open-shift mode.');save();render()}else if(G.seconds%15===0)save()}
function mobileScrollTop(){if(window.matchMedia('(max-width:760px)').matches)window.scrollTo({top:0,behavior:'instant'});}
function goto(view){if(view==='dispatch'&&!G.started){render();return}if(!G.started)return;G.screen=view;G.district=null;G.finding=null;G.pending=null;G.confirmReset=false;save();render();mobileScrollTop()}
function newAssignment(){
 G=newState({seed:0,id:'',citizen:'',evidence:[],people:{},secrets:{},facts:{}});
 G.started=false;choices=[candidate(378,true)];save();render();
}
function submit(){playUISound('submit');let qs=questionSet();G.score=qs.reduce((count,q)=>count+(answerMatches(q,G.answers[q.id])?1:0),0);G.done=true;G.screen='result';G.activeReportField=null;G.showSecretsReveal=true;pushLog('REPORT SUBMITTED',`${G.score}/${qs.length} correct.`);save();render()}
function onClick(event){let b=event.target.closest('button');if(!b)return;if(G.rolling)return;if(G.pending&&!['collect-pending','discard-pending'].includes(b.dataset.action)){G.pending=null;}
if(b.id==='musicToggle'){setMusicEnabled(!AUDIO.enabled);return}
if(b.dataset.reportSlot){const currentScroll=document.querySelector('.reportJournal')?.scrollTop||0;G.activeReportField=b.dataset.reportSlot;G.screen='report';save();render();const journal=document.querySelector('.reportJournal');if(journal){journal.scrollTop=currentScroll;if(window.matchMedia('(max-width:760px)').matches){journal.scrollIntoView({block:'start',behavior:'instant'});}}return}
if(b.dataset.evidenceValue!==undefined){
 if(!G.activeReportField||G.screen!=='report')return;
 const journalScroll=document.querySelector('.reportJournal')?.scrollTop||0;
 const field=G.activeReportField;
 playUISound('match');G.answers[field]=b.dataset.evidenceValue;
 G.activeReportField=null;
 save();render();
 const journal=document.querySelector('.reportJournal');if(journal)journal.scrollTop=journalScroll;
 if(window.matchMedia('(max-width:760px)').matches){const target=document.querySelector('[data-report-slot="'+field+'"]');if(target)target.scrollIntoView({block:'center',behavior:'instant'});}
 return;
}
if(b.dataset.clearReport){delete G.answers[b.dataset.clearReport];G.activeReportField=b.dataset.clearReport;save();render();return}
if(b.dataset.choice!==undefined){startCase(Number(b.dataset.choice));return}
if(b.dataset.object!==undefined){inspect(Number(b.dataset.object));return}
if(b.dataset.npc){G.bribePending=null;G.npc=b.dataset.npc;G.screen='talk';G.dialogue=null;G.dialogueRoll=null;G.originalRoll=null;G.bonusRoll=null;G.selectedTopic=null;G.finding=null;G.conversationProgress=G.conversationProgress||{};G.conversationTranscript=G.conversationTranscript||{};save();render();mobileScrollTop();return}
if(b.dataset.topic){ask(b.dataset.topic);return}
if(b.dataset.deduce){let [actor,i]=b.dataset.deduce.split(':');chooseDeduction(actor,Number(i));return}
if(b.dataset.place){if(!isPlaceUnlocked(b.dataset.place)){G.finding={kind:'error',title:'Location locked',body:'That location has not been revealed yet. Ask a witness where Martin went next.'};G.screen='map';save();render();return}G.location=b.dataset.place;G.screen='room';G.finding=null;save();render();mobileScrollTop();return}
if(b.dataset.district){if(!unlockedDistricts().includes(b.dataset.district))return;G.district=b.dataset.district;G.screen='map';render();mobileScrollTop();return}
if(b.dataset.view){goto(b.dataset.view);return}
const a=b.dataset.action;
if(a==='dismiss-secrets'){G.showSecretsReveal=false;save();render();return}
if(a==='show-secrets'){G.showSecretsReveal=true;save();render();return}
if(a==='back-district'){G.district=VP[G.location].district;G.screen='map';G.finding=null;G.pending=null;save();render();mobileScrollTop();return}
if(a==='record-testimony'){recordTestimony();return}
if(a==='advance-conversation'){advanceConversation();return}
if(a==='throw-die'){throwDie();return}
if(a==='offer-bribe'){offerBribe();return}
if(a==='decline-bribe'){declineBribe();return}
if(a==='collect-pending'){collectPending();return}
if(a==='discard-pending'){discardPending();return}
if(a==='clear-finding'){dismissFinding();return}
if(a==='refresh-cases'){choices=[candidate(378,true)];render();return}
if(a==='case-desk'){if(G.started){G.confirmReset=true;render()}else{choices=[];render()}return}
if(a==='submit'){submit();return}
if(a==='new-dossier'){newAssignment();return}
if(a==='cancel-reset'){G.confirmReset=false;render();return}
if(a==='confirm-reset'){newAssignment();return}
}
function init(){AUDIO.enabled=false;updateMusicButton();G=load()||newState({seed:0,id:'',citizen:'',evidence:[],people:{},secrets:{},facts:{}});G.started=!!G.started;if(G.case&&/Citizen J\. S\./.test(G.case.citizen||''))G.case.citizen='Martin Vale';G.rolling=false;G.rollingKind=null;G.bribePending=null;if(!Number.isFinite(G.cash))G.cash=STARTING_CASH;if(!G.bribedTopics)G.bribedTopics={};if(!G.conversationProgress)G.conversationProgress={};if(!G.conversationTranscript)G.conversationTranscript={};if(!G.lowStreaks)G.lowStreaks={};if(!G.angered)G.angered={};if(!G.started)choices=[];$('#app').addEventListener('click',onClick);$('#rail').addEventListener('click',onClick);$('#musicToggle').addEventListener('click',()=>setMusicEnabled(!AUDIO.enabled));$('#journalNav').addEventListener('click',()=>goto('journal'));$('#homeBrand').addEventListener('click',()=>G.started?goto('map'):render());document.body.addEventListener('pointerdown',()=>{if(AUDIO.enabled&&AUDIO.ctx&&AUDIO.ctx.state==='suspended')AUDIO.ctx.resume()},{passive:true});$('#restartNav').addEventListener('click',()=>{if(!G.started)return;G.confirmReset=!G.confirmReset;render()});$('#app').addEventListener('change',e=>{let inp=e.target;if(inp.matches('input[type=radio][name^=answer-]')){G.answers[inp.name.slice(7)]=Number(inp.value);save()}});$('#app').addEventListener('input',e=>{if(e.target.dataset.report){G.answers[e.target.dataset.report]=e.target.value;save()}});clockTimer=setInterval(tick,1000);render()}
window.__UC_TEST__={generate,questionSetFor:(c)=>{let g=G;G=newState(c);const qs=questionSet();G=g;return qs},secretChoicesFor:(c,a)=>{let g=G;G=newState(c);let x=secretChoices(a);G=g;return x},getState:()=>G,recordTestimony,hash,fairD6,fairBribedD6,offerBribe,declineBribe};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
